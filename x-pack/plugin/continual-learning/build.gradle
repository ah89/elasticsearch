apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-cluster-test'

esplugin {
  name = 'x-pack-continual-learning'
  description = 'Elasticsearch Expanded Pack Plugin - Continual Learning via Geometric Coresets and LoRA'
  classname = 'org.elasticsearch.xpack.continuallearning.ContinualLearningPlugin'
  extendedPlugins = ['x-pack-core']
}

base {
  archivesName = 'x-pack-continual-learning'
}

dependencies {
  compileOnly project(path: xpackModule('core'))
  implementation project(':libs:simdvec')

  testImplementation testArtifact(project(':server'))
  testImplementation testArtifact(project(xpackModule('core')))
}

